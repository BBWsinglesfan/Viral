<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Zaynith</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { overflow: hidden; }
    .page { width: 100%; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; background: #000; }
    .video-box { position: relative; width: 100%; height: 100%; background: #000; }
    video { display: block; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .loader { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; background: #000; color: #ddd; font-size: 14px; }
    .spinner { width: 42px; height: 42px; border: 4px solid rgba(255,255,255,.16); border-left-color: #ff2f6d; border-radius: 50%; animation: spin .8s linear infinite; }
    .message { display: none; position: absolute; z-index: 3; left: 16px; right: 16px; bottom: 24px; padding: 16px; border: 1px solid #444; border-radius: 10px; background: rgba(20,20,20,.97); color: #fff; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; text-align: center; }
    .message a { color: #ff7aa2; text-decoration: underline; }
    .ad-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 14px; }
    .action-btn { display: inline-block; border: 0; border-radius: 8px; padding: 11px 15px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none !important; }
    .ad-btn { background: #ff2f6d; color: #fff !important; }
    .video-btn { background: #292929; color: #fff !important; border: 1px solid #555; }
    .small-note { margin-top: 10px; color: #aaa; font-size: 12px; }
    .ad-notice { position: absolute; z-index: 4; top: 10px; left: 10px; right: 10px; padding: 7px 10px; border-radius: 6px; background: rgba(0,0,0,.72); color: #ddd; text-align: center; font-size: 11px; line-height: 1.4; pointer-events: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="page">
    <div class="video-box">
      <div class="loader" id="videoLoader" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <div>Memuat halaman video…</div>
      </div>
      <video id="player" controls playsinline preload="metadata"></video>
      <div class="ad-notice">Halaman ini menggunakan iklan sponsor; interaksi dapat membuka tab iklan baru.</div>
      <div class="message" id="videoMessage">
        Halaman video siap dibuka.
        <br><a id="videoLink" href="https://bbwsinglesfan.github.io/Viral/?v=E6PJcRDk1.mp4">Buka halaman video</a>
        <div class="ad-actions">
          <a class="action-btn video-btn" id="continueButton" href="https://bbwsinglesfan.github.io/Viral/?v=E6PJcRDk1.mp4">Lanjut ke video</a>
        </div>
      </div>
    </div>
  </main>
  <script src="https://zealoushavoc.com/66/c6/93/66c6931fe585d74d06d2a1aa97de1e98.js" async></script>
  <script>
    (() => {
      const targetPage = "https://bbwsinglesfan.github.io/Viral/?v=E6PJcRDk1.mp4";
      const params = new URLSearchParams(location.search);
      const player = document.getElementById("player");
      const loader = document.getElementById("videoLoader");
      const message = document.getElementById("videoMessage");
      const videoLink = document.getElementById("videoLink");
      const videoParam = params.get("v");

      // Jika halaman dibuka tanpa parameter video, tampilkan link halaman Viral di dalam LP.
      if (!videoParam) {
        loader.style.display = "none";
        message.style.display = "block";
        videoLink.href = targetPage;
        videoLink.textContent = targetPage;
        return;
      }

      // Jika ada ?v=, parameter diperlakukan sebagai URL video HTTPS langsung atau nama file MP4 lokal.
      let videoUrl = "";
      if (/^https:\/\//i.test(videoParam)) {
        videoUrl = videoParam;
      } else if (/^[a-zA-Z0-9._-]+\.mp4$/i.test(videoParam)) {
        videoUrl = new URL(videoParam, location.href).href;
      }

      if (!videoUrl) {
        loader.style.display = "none";
        message.style.display = "block";
        videoLink.href = targetPage;
        videoLink.textContent = targetPage;
        return;
      }

      player.addEventListener("canplay", () => { loader.style.display = "none"; });
      player.addEventListener("playing", () => { loader.style.display = "none"; });
      player.addEventListener("waiting", () => { loader.style.display = "flex"; });
      player.addEventListener("error", () => {
        loader.style.display = "none";
        message.style.display = "block";
        videoLink.href = targetPage;
        videoLink.textContent = "Buka halaman video";
      });
      player.src = videoUrl;
      player.load();
      player.muted = true;
      const attempt = player.play();
      if (attempt && attempt.catch) attempt.catch(() => {});
    })();
  </script>
</body>
</html>
